name: Feature request
description: Suggest an improvement or new capability
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For larger changes, an issue first helps us agree on approach before a PR
        (see [CONTRIBUTING.md](https://github.com/arsamsarabi/grit/blob/main/CONTRIBUTING.md)).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction are you hitting?
      placeholder: I want to … but grit currently …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would a good solution look like? CLI flags, TUI flow, config, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you’ve tried or thought about.
    validations:
      required: false

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I’m interested in opening a PR for this
          required: false

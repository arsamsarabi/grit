name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm Trusted Publisher (OIDC)
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # changeset publish → npm publish (OIDC; no NPM_TOKEN)
          publish: bun run release
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance only in CI (OIDC). Do not set in package.json — local publish fails.
          NPM_CONFIG_PROVENANCE: "true"

  homebrew:
    name: Bump Homebrew formula
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Update Formula/grit.rb from npm
        run: bun run scripts/sync-homebrew-formula.ts

      - name: Commit formula bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Must `git add` first: `git diff` ignores untracked files, so a brand-new
          # Formula/grit.rb used to exit early as "already up to date" and never push.
          git add Formula/grit.rb
          if git diff --cached --quiet Formula/grit.rb; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "chore: bump Homebrew formula to $(node -p "require('./package.json').version")"
          git push
